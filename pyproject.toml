[project]
name = "terminal-agent-architectures"
version = "1.0.0"
description = "Agent architectures for LLM-based terminal agents: a comparative study across model capability (diploma thesis, NTUA ECE)."
authors = [
    {name = "Charalampos Ioannis Sfyris"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "terminal-bench>=0.2.18,<0.3.0",
    "pydantic>=2.12.5,<3.0.0",
    "openai>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
